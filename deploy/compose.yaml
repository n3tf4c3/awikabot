# Servidor do awikabot num host com Docker. Rede própria com sub-rede declarada,
# porta publicada só em loopback, sem privilégios e com sistema de arquivos
# somente leitura fora do volume. O acesso de fora entra por um túnel, nunca
# por porta aberta.
#
# Login do motor, feito uma vez pela pessoa dona da conta:
#   docker compose -f deploy/compose.yaml run --rm -it --entrypoint claude server auth login
# Login do Codex, só para quem usa bots nele, também pela pessoa dona da conta:
#   docker compose -f deploy/compose.yaml run --rm -it --entrypoint codex server login --device-auth
# Código para parear um aparelho:
#   docker compose -f deploy/compose.yaml exec server node /app/server.mjs parear
# Backup e restauração: deploy/backup.sh e deploy/restaurar.sh.
# Acesso de fora, pelo túnel: docs/tunel.md.
#   docker compose -f deploy/compose.yaml --profile tunel up -d
#
# Para ensaiar ao lado do servidor de verdade, outro projeto precisa de outra
# sub-rede e de outra porta no host:
#   COMPOSE_PROJECT_NAME=awikabot-ensaio AWIKA_SUBREDE=172.28.0.0/16 AWIKA_PORTA_HOST=8799
name: awikabot

services:
  server:
    image: awikabot-server:${AWIKA_TAG:-dev}
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    init: true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - dados:/data
    ports:
      - "127.0.0.1:${AWIKA_PORTA_HOST:-8790}:8790"
    networks:
      - awikabot
    # Servidor mais quatro turnos simultâneos do motor, no pior caso medido.
    mem_limit: 2g
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Túnel nomeado da Cloudflare: a única entrada de fora, e só sobe com `--profile tunel`.
  # O endereço público e o destino dele (http://server:8790) ficam no painel da Cloudflare.
  # Aqui vai só o token do túnel, lido de deploy/.env, que o Git ignora. Ver docs/tunel.md.
  tunel:
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    profiles:
      - tunel
    # Num contêiner, as métricas do cloudflared ouviriam em todas as interfaces, na rede que o
    # servidor e os bots enxergam. Ficam em loopback, dentro do contêiner do túnel.
    command: tunnel --no-autoupdate --metrics 127.0.0.1:20241 run
    environment:
      TUNNEL_TOKEN: ${AWIKA_TUNEL_TOKEN:-}
    read_only: true
    networks:
      - awikabot
    mem_limit: 128m
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

networks:
  awikabot:
    ipam:
      config:
        - subnet: ${AWIKA_SUBREDE:-172.27.0.0/16}

volumes:
  dados:
