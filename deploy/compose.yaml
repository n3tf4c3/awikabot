# Servidor do awikabot num host com Docker. Rede própria com sub-rede declarada,
# porta publicada só em loopback, sem privilégios e com sistema de arquivos
# somente leitura fora do volume. O acesso de fora entra por um túnel, nunca
# por porta aberta.
#
# Login do motor, feito uma vez pela pessoa dona da conta:
#   docker compose -f deploy/compose.yaml run --rm -it --entrypoint claude server auth login
# Código para parear um aparelho:
#   docker compose -f deploy/compose.yaml exec server node /app/server.mjs parear
# Backup e restauração: deploy/backup.sh e deploy/restaurar.sh.
#
# Para ensaiar ao lado do servidor de verdade, outro projeto precisa de outra
# sub-rede e de outra porta no host:
#   COMPOSE_PROJECT_NAME=awikabot-ensaio AWIKA_SUBREDE=172.28.0.0/16 AWIKA_PORTA_HOST=8799
name: awikabot

services:
  server:
    image: awikabot-server:${AWIKA_TAG:-dev}
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    init: true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - dados:/data
    ports:
      - "127.0.0.1:${AWIKA_PORTA_HOST:-8790}:8790"
    networks:
      - awikabot
    # Servidor mais quatro turnos simultâneos do motor, no pior caso medido.
    mem_limit: 2g
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  awikabot:
    ipam:
      config:
        - subnet: ${AWIKA_SUBREDE:-172.27.0.0/16}

volumes:
  dados:
