# App de desktop do awikabot. Um workspace Cargo à parte do pnpm: o contrato com o servidor
# chega pelo arquivo gerado em crates/cliente/src/contrato.rs.
[workspace]
resolver = "3"
members = ["crates/cliente", "crates/app"]

[workspace.package]
# A versão do app: é daqui que saem a do executável e a do instalador.
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
awikabot-cliente = { path = "crates/cliente" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sem recursos padrão: só rustls, com a verificação de certificado do sistema.
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier", "json", "gzip"] }
# A GPUI vem do repositório do Zed, fixada num commit: o crate publicado está parado.
# Os dois crates sobem juntos, e o patch abaixo acompanha o do Zed nesse mesmo commit.
gpui = { git = "https://github.com/zed-industries/zed", rev = "decbf641b18f1982b3475c037e7c5c554471574f" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "decbf641b18f1982b3475c037e7c5c554471574f" }

[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

# Sem símbolos de depuração das dependências: a pasta target/ fica dezenas de vezes menor.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
