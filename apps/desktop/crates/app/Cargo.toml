[package]
name = "awikabot-desktop"
description = "App de desktop do awikabot: janela em GPUI sobre o cliente do servidor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "awikabot"
path = "src/main.rs"

[dependencies]
awikabot-cliente.workspace = true
futures = "0.3"
gpui.workspace = true
gpui_platform.workspace = true
# Passo do cursor por caractere como a pessoa o vê (letra com acento à parte, emoji composto).
unicode-segmentation = "1"

# O cofre de credenciais de cada sistema. Só o backend nativo: nada de arquivo nem de serviço à parte.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
# A marca de "app aberto" que o desinstalador consulta, e a conferência da assinatura do pacote de atualização.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

# Grava o ícone e a versão no executável do Windows, a partir do build.rs.
[build-dependencies]
winresource = "0.1"

[dev-dependencies]
# O hash do pacote que o servidor de mentira publica nos testes do atualizador.
sha2 = "0.10"
awikabot-cliente = { workspace = true, features = ["teste-suporte"] }
gpui = { workspace = true, features = ["test-support"] }
