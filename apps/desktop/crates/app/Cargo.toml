[package]
name = "awikabot-desktop"
description = "App de desktop do awikabot: janela em GPUI sobre o cliente do servidor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "awikabot"
path = "src/main.rs"

[dependencies]
awikabot-cliente.workspace = true
futures = "0.3"
gpui.workspace = true
gpui_platform.workspace = true

[dev-dependencies]
awikabot-cliente = { workspace = true, features = ["teste-suporte"] }
gpui = { workspace = true, features = ["test-support"] }
